[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-rational-allocation"
version = "0.1.0"
description = "Resource-rational analysis of continuous allocation decisions"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.23.5",
  "pandas>=2.0",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.tutoring_analysis" = ["*.cjs"]
"src.design_validation" = ["*.cjs"]
"src.tutoring_statistics" = ["*.R", "*.cjs", "data/*.json"]
